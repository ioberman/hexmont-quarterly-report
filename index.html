<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hexmont Quarterly Report</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,4 93,27.5 93,72.5 50,96 7,72.5 7,27.5' fill='none' stroke='%23a89060' stroke-width='5'/><polygon points='50,14 83,32.5 83,67.5 50,86 17,67.5 17,32.5' fill='none' stroke='%23a89060' stroke-width='2'/><text x='50' y='68' text-anchor='middle' font-family='serif' font-size='44' font-weight='bold' fill='%23a89060'>H</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a2330; color: #e8edf2; font-family: sans-serif; }

  nav {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 12px 16px;
    background: #131920;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .nav-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-right: 20px;
    flex-shrink: 0;
  }
  .nav-brand svg { width: 32px; height: 32px; }
  .nav-brand-title {
    font-size: 14px;
    font-weight: 600;
    color: #a89060;
    letter-spacing: 0.04em;
    white-space: nowrap;
  }

  .dropdown { position: relative; }

  .dropdown-trigger {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 7px 14px;
    font-size: 13px;
    cursor: pointer;
    border-radius: 6px;
    color: #c8d8e8;
    border: none;
    background: none;
    white-space: nowrap;
    transition: color 0.15s, background 0.15s;
  }
  .dropdown-trigger:hover,
  .dropdown:hover .dropdown-trigger,
  .dropdown-trigger.active { color: #e8edf2; background: #2a3a4d; }

  .dropdown-trigger .arrow {
    font-size: 9px;
    opacity: 0.6;
    transition: transform 0.2s;
  }
  .dropdown:hover .arrow { transform: rotate(180deg); }

  /* 
    Key trick: padding-top creates an invisible hover bridge between
    the trigger and the menu card so the mouse never leaves the element
  */
  .dropdown-menu {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    padding-top: 4px;
    min-width: 200px;
    z-index: 100;
  }
  .dropdown:hover .dropdown-menu { display: block; }

  .dropdown-menu-inner {
    background: #1e2d3d;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    padding: 6px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  .dropdown-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #4a6070;
    padding: 6px 12px 4px;
  }

  .dropdown-item {
    display: block;
    width: 100%;
    padding: 8px 12px;
    font-size: 13px;
    color: #c8d8e8;
    background: none;
    border: none;
    border-radius: 5px;
    text-align: left;
    cursor: pointer;
    transition: background 0.12s, color 0.12s;
    white-space: nowrap;
  }
  .dropdown-item:hover { background: #2a3a4d; color: #e8edf2; }
  .dropdown-item.active { color: #a89060; font-weight: 500; }

  .panel { display: none; padding: 16px; }
  .panel.active { display: block; }
  .viz-container { width: 100%; }
</style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
      <polygon points='50,4 93,27.5 93,72.5 50,96 7,72.5 7,27.5' fill='none' stroke='#a89060' stroke-width='5'/>
      <polygon points='50,14 83,32.5 83,67.5 50,86 17,67.5 17,32.5' fill='none' stroke='#a89060' stroke-width='2'/>
      <text x='50' y='68' text-anchor='middle' font-family='serif' font-size='44' font-weight='bold' fill='#a89060'>H</text>
    </svg>
    <span class="nav-brand-title">Hexmont Analytics Hub</span>
  </div>

  <!-- Performance -->
  <div class="dropdown">
    <button class="dropdown-trigger active" id="trigger-performance">
      Performance <span class="arrow">▼</span>
    </button>
    <div class="dropdown-menu">
      <div class="dropdown-menu-inner">
        <button class="dropdown-item active" onclick="show('overviews', 'performance', this)">Company Overviews</button>
        <button class="dropdown-item" onclick="show('roic', 'performance', this)">ROIC</button>
      </div>
    </div>
  </div>

  <!-- Competition -->
  <div class="dropdown">
    <button class="dropdown-trigger" id="trigger-competition">
      Competition <span class="arrow">▼</span>
    </button>
    <div class="dropdown-menu">
      <div class="dropdown-menu-inner">
        <button class="dropdown-item" onclick="show('market', 'competition', this)">Market Analysis</button>
        <button class="dropdown-item" onclick="show('profitbubble', 'competition', this)">Competitive Mkt Position</button>
        <button class="dropdown-item" onclick="show('bubble', 'competition', this)">Price × Quality</button>
        <button class="dropdown-item" onclick="show('pricetrends', 'competition', this)">Price Trends</button>
        <button class="dropdown-item" onclick="show('demand', 'competition', this)">Demand by Market</button>
        <button class="dropdown-item" onclick="show('country', 'competition', this)">Country Analysis</button>
      </div>
    </div>
  </div>

  <!-- Product -->
  <div class="dropdown">
    <button class="dropdown-trigger" id="trigger-product">
      Product <span class="arrow">▼</span>
    </button>
    <div class="dropdown-menu">
      <div class="dropdown-menu-inner">
        <button class="dropdown-item" onclick="show('quality', 'product', this)">Quality</button>
        <button class="dropdown-item" onclick="show('qualityroi', 'product', this)">Quality Spend ROI</button>
      </div>
    </div>
  </div>

  <!-- Sustainability -->
  <div class="dropdown">
    <button class="dropdown-trigger" id="trigger-sustainability">
      Sustainability <span class="arrow">▼</span>
    </button>
    <div class="dropdown-menu">
      <div class="dropdown-menu-inner">
        <button class="dropdown-item" onclick="show('eco', 'sustainability', this)">Environmental</button>
        <button class="dropdown-item" onclick="show('greenroi', 'sustainability', this)">Green Spend ROI</button>
      </div>
    </div>
  </div>

</nav>

<div class="panel active" id="panel-overviews"><div id="viz-overviews" class="viz-container"></div></div>
<div class="panel" id="panel-market"><div id="viz-market" class="viz-container"></div></div>
<div class="panel" id="panel-roic"><div id="viz-roic" class="viz-container"></div></div>
<div class="panel" id="panel-profitbubble"><div id="viz-profitbubble" class="viz-container"></div></div>
<div class="panel" id="panel-bubble"><div id="viz-bubble" class="viz-container"></div></div>
<div class="panel" id="panel-quality"><div id="viz-quality" class="viz-container"></div></div>
<div class="panel" id="panel-eco"><div id="viz-eco" class="viz-container"></div></div>
<div class="panel" id="panel-country"><div id="viz-country" class="viz-container"></div></div>
<div class="panel" id="panel-pricetrends"><div id="viz-pricetrends" class="viz-container"></div></div>
<div class="panel" id="panel-greenroi"><div id="viz-greenroi" class="viz-container"></div></div>
<div class="panel" id="panel-qualityroi"><div id="viz-qualityroi" class="viz-container"></div></div>
<div class="panel" id="panel-demand"><div id="viz-demand" class="viz-container"></div></div>

<script type='module' src='https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js'></script>
<script type='module'>
  const configs = {
    overviews:   { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-CompanyOverviews/CompanyProfile',         h: 1100 },
    market:      { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-MarketAnalysis/CompetitionAnalysis',       h: 1000 },
    roic:        { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-ROIC/ROICDashboard',                       h: 900  },
    profitbubble:{ url: 'https://public.tableau.com/views/HexmontQuarterlyReport-CompetitiveMarketPosition/BubbleCharts-Profitability', h: 900  },
    bubble:      { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-BubbleChart/BubbleCharts',                 h: 768  },
    quality:     { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-Quality/QualityDashboard',                 h: 768  },
    eco:         { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-Eco-Friendly/EnvironmentalDashboard',      h: 768  },
    country:     { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-CountryAnalysis/CountryAnalysis',          h: 1000 },
    pricetrends: { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-PriceTrends/CompanyMarketPriceTrend',      h: 900  },
    greenroi:    { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-GreenROI/GreenSpendROIDashboard',          h: 900  },
    qualityroi:  { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-QualityROI/QualitySpendROIDashboard',      h: 900  },
    demand:      { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-DemandChange/Whoistakingourcustomers',     h: 1000 },
  };

  const loaded = {};

  function initViz(id) {
    if (loaded[id]) return;
    loaded[id] = true;
    const cfg = configs[id];
    const container = document.getElementById('viz-' + id);
    const viz = document.createElement('tableau-viz');
    viz.setAttribute('src', cfg.url);
    viz.setAttribute('width', '100%');
    viz.setAttribute('height', cfg.h);
    viz.setAttribute('hide-tabs', '');
    container.appendChild(viz);
  }

  window.show = function(id, category, itemEl) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.dropdown-trigger').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.dropdown-item').forEach(i => i.classList.remove('active'));

    document.getElementById('panel-' + id).classList.add('active');
    document.getElementById('trigger-' + category).classList.add('active');
    itemEl.classList.add('active');

    initViz(id);
  };

  initViz('overviews');
</script>
</body>
</html>
