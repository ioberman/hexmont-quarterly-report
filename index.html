<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hexmont Quarterly Report</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><polygon points='50,4 93,27.5 93,72.5 50,96 7,72.5 7,27.5' fill='none' stroke='%23a89060' stroke-width='5'/><polygon points='50,14 83,32.5 83,67.5 50,86 17,67.5 17,32.5' fill='none' stroke='%23a89060' stroke-width='2'/><text x='50' y='68' text-anchor='middle' font-family='serif' font-size='44' font-weight='bold' fill='%23a89060'>H</text></svg>">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #1a2330; color: #e8edf2; font-family: sans-serif; }

  nav { display: flex; align-items: center; gap: 4px; padding: 12px 16px; background: #131920; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .nav-brand { display: flex; align-items: center; gap: 10px; margin-right: 16px; flex-shrink: 0; }
  .nav-brand svg { width: 32px; height: 32px; }
  .nav-brand-title { font-size: 14px; font-weight: 600; color: #a89060; letter-spacing: 0.04em; white-space: nowrap; }

  .tab {
    padding: 6px 16px;
    font-size: 13px;
    cursor: pointer;
    border-radius: 6px;
    color: #7a8fa6;
    border: none;
    background: none;
  }
  .tab:hover { color: #e8edf2; }
  .tab.active { background: #2a3a4d; color: #e8edf2; }

  .panel { display: none; padding: 16px; }
  .panel.active { display: block; }

  .viz-container { width: 100%; }

  tableau-viz { width: 100%; }
</style>
</head>
<body>

<nav>
  <div class="nav-brand">
    <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
      <polygon points='50,4 93,27.5 93,72.5 50,96 7,72.5 7,27.5' fill='none' stroke='#a89060' stroke-width='5'/>
      <polygon points='50,14 83,32.5 83,67.5 50,86 17,67.5 17,32.5' fill='none' stroke='#a89060' stroke-width='2'/>
      <text x='50' y='68' text-anchor='middle' font-family='serif' font-size='44' font-weight='bold' fill='#a89060'>H</text>
    </svg>
    <span class="nav-brand-title">Hexmont Analytics Hub</span>
  </div>
  <button class="tab active" onclick="show('overviews', this)">Company Overviews</button>
  <button class="tab" onclick="show('market', this)">Market Analysis</button>
  <button class="tab" onclick="show('roic', this)">ROIC</button>
  <button class="tab" onclick="show('bubble', this)">Price × Quality</button>
  <button class="tab" onclick="show('quality', this)">Quality</button>
  <button class="tab" onclick="show('eco', this)">Environmental</button>
  <button class="tab" onclick="show('country', this)">Country Analysis</button>
  <button class="tab" onclick="show('pricetrends', this)">Price Trends</button>
  <button class="tab" onclick="show('greenroi', this)">Green Spend ROI</button>
  <button class="tab" onclick="show('qualityroi', this)">Quality Spend ROI</button>
  <button class="tab" onclick="show('demand', this)">Demand by Market</button>
</nav>

<div class="panel active" id="panel-overviews"><div id="viz-overviews" class="viz-container"></div></div>
<div class="panel" id="panel-market"><div id="viz-market" class="viz-container"></div></div>
<div class="panel" id="panel-roic"><div id="viz-roic" class="viz-container"></div></div>
<div class="panel" id="panel-bubble"><div id="viz-bubble" class="viz-container"></div></div>
<div class="panel" id="panel-quality"><div id="viz-quality" class="viz-container"></div></div>
<div class="panel" id="panel-eco"><div id="viz-eco" class="viz-container"></div></div>
<div class="panel" id="panel-country"><div id="viz-country" class="viz-container"></div></div>
<div class="panel" id="panel-pricetrends"><div id="viz-pricetrends" class="viz-container"></div></div>
<div class="panel" id="panel-greenroi"><div id="viz-greenroi" class="viz-container"></div></div>
<div class="panel" id="panel-qualityroi"><div id="viz-qualityroi" class="viz-container"></div></div>
<div class="panel" id="panel-demand"><div id="viz-demand" class="viz-container"></div></div>

<script type='module' src='https://public.tableau.com/javascripts/api/tableau.embedding.3.latest.min.js'></script>
<script type='module'>
  const configs = {
    overviews: { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-CompanyOverviews/CompanyProfile', h: 1100 },
    market:  { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-MarketAnalysis/CompetitionAnalysis',  h: 1000 },
    roic:    { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-ROIC/ROICDashboard',                  h: 900  },
    bubble:  { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-BubbleChart/BubbleCharts',            h: 768  },
    quality: { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-Quality/QualityDashboard',            h: 768  },
    eco:     { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-Eco-Friendly/EnvironmentalDashboard', h: 768  },
    country: { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-CountryAnalysis/CountryAnalysis',     h: 1000 },
    pricetrends: { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-PriceTrends/CompanyMarketPriceTrend', h: 900 },
    greenroi:    { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-GreenROI/GreenSpendROIDashboard',      h: 900 },
    qualityroi:  { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-QualityROI/QualitySpendROIDashboard',  h: 900 },
    demand:      { url: 'https://public.tableau.com/views/HexmontQuarterlyReport-DemandChange/Whoistakingourcustomers', h: 1000 },
  };

  const loaded = {};

  function initViz(id) {
    if (loaded[id]) return;
    loaded[id] = true;
    const cfg = configs[id];
    const container = document.getElementById('viz-' + id);
    const viz = document.createElement('tableau-viz');
    viz.setAttribute('src', cfg.url);
    viz.setAttribute('width', '100%');
    viz.setAttribute('height', cfg.h);
    viz.setAttribute('hide-tabs', '');
    container.appendChild(viz);
  }

  window.show = function(id, el) {
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('panel-' + id).classList.add('active');
    el.classList.add('active');
    initViz(id);
  };

  initViz('overviews');
</script>
</body>
</html>
